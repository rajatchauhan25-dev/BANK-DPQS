<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank DPQ Hub | The SSC Scholars</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f5ff;
    --magenta: #ff006e;
    --yellow: #f5ff00;
    --dark: #050810;
    --darker: #020408;
    --panel: rgba(0,245,255,0.04);
    --border: rgba(0,245,255,0.18);
    --text: #b0e0e8;
    --dim: #4a6a72;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--darker);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  /* ─── HEADER ─── */
  header {
    text-align: center;
    padding: 40px 0 30px;
    position: relative;
  }

  .brand {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--magenta);
    text-transform: uppercase;
    margin-bottom: 10px;
    opacity: 0.85;
  }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 5vw, 38px);
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    line-height: 1.15;
    text-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0,245,255,0.3);
  }

  h1 span { color: var(--cyan); }

  .tagline {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 3px;
    margin-top: 10px;
  }

  .header-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    margin: 24px auto 0;
    max-width: 500px;
    opacity: 0.5;
  }

  /* ─── MODULE TABS ─── */
  .module-tabs {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 32px 0 28px;
  }

  .mod-btn {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 12px 36px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--dim);
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    text-transform: uppercase;
  }

  .mod-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(0,245,255,0.07);
  }

  .mod-btn.active {
    border-color: var(--cyan);
    color: var(--dark);
    background: var(--cyan);
    text-shadow: none;
    box-shadow: 0 0 20px rgba(0,245,255,0.4), 0 0 40px rgba(0,245,255,0.15);
  }

  .mod-btn.active-mains {
    border-color: var(--magenta);
    background: var(--magenta);
    box-shadow: 0 0 20px rgba(255,0,110,0.4), 0 0 40px rgba(255,0,110,0.15);
  }

  /* ─── MODULE PANEL ─── */
  .module-panel { display: none; }
  .module-panel.active { display: block; }

  /* ─── SECTION TABS ─── */
  .section-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0;
  }

  .sec-btn {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.5px;
    padding: 9px 24px;
    border: 1px solid transparent;
    border-bottom: none;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: all 0.18s;
    text-transform: uppercase;
    position: relative;
    bottom: -1px;
  }

  .sec-btn:hover { color: var(--cyan); }

  .sec-btn.active {
    border-color: var(--border);
    border-bottom-color: var(--darker);
    color: var(--cyan);
    background: var(--panel);
  }

  .mains-panel .sec-btn.active {
    color: var(--magenta);
    border-color: rgba(255,0,110,0.25);
    border-bottom-color: var(--darker);
  }

  /* ─── SECTION CONTENT ─── */
  .section-content { display: none; }
  .section-content.active { display: block; }

  /* ─── STATS BAR ─── */
  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding: 10px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
  }

  .stats-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--dim);
  }

  .stats-count {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--cyan);
  }

  .mains-panel .stats-count { color: var(--magenta); }

  /* ─── CARDS GRID ─── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 8px;
  }

  .day-card {
    display: block;
    padding: 13px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
  }

  .day-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 2px; height: 100%;
    background: var(--cyan);
    opacity: 0;
    transition: opacity 0.18s;
  }

  .day-card:hover {
    border-color: var(--cyan);
    background: rgba(0,245,255,0.07);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,245,255,0.12);
  }

  .day-card:hover::before { opacity: 1; }

  .mains-panel .day-card::before { background: var(--magenta); }
  .mains-panel .day-card:hover {
    border-color: var(--magenta);
    background: rgba(255,0,110,0.06);
    box-shadow: 0 4px 20px rgba(255,0,110,0.12);
  }

  .card-day {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 4px;
  }

  .card-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #d0eef4;
    line-height: 1.2;
  }

  .card-icon {
    font-size: 16px;
    float: right;
    margin-top: -2px;
    opacity: 0.5;
  }

  /* ─── FOOTER ─── */
  footer {
    text-align: center;
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  footer p {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 2px;
  }

  /* ─── ANIMATIONS ─── */
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.8; }
    94% { opacity: 1; }
    96% { opacity: 0.9; }
    97% { opacity: 1; }
  }

  h1 { animation: flicker 8s infinite; }

  /* Responsive */
  @media (max-width: 480px) {
    .module-tabs { flex-direction: column; align-items: center; }
    .mod-btn { width: 220px; text-align: center; }
    .cards-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- HEADER -->
  <header>
    <div class="brand">The SSC Scholars</div>
    <h1>BANK <span>DPQ</span> HUB</h1>
    <div class="tagline">// DAILY PRACTICE QUESTIONS · 2025 //</div>
    <div class="header-line"></div>
  </header>

  <!-- MODULE TABS -->
  <div class="module-tabs">
    <button class="mod-btn active" onclick="switchModule('prelims')">⬡ Prelims</button>
    <button class="mod-btn" onclick="switchModule('mains')">⬡ Mains</button>
  </div>

  <!-- ══════════ PRELIMS MODULE ══════════ -->
  <div class="module-panel active" id="panel-prelims">
    <div class="section-tabs">
      <button class="sec-btn active" onclick="switchSection('prelims','english')">English</button>
      <button class="sec-btn" onclick="switchSection('prelims','reasoning')">Reasoning</button>
    </div>

    <!-- Prelims → English -->
    <div class="section-content active" id="prelims-english">
      <div class="stats-bar">
        <span class="stats-label">// PRELIMS · ENGLISH</span>
        <span class="stats-count">100 SETS</span>
      </div>
      <div class="cards-grid" id="grid-pre-eng"></div>
    </div>

    <!-- Prelims → Reasoning -->
    <div class="section-content" id="prelims-reasoning">
      <div class="stats-bar">
        <span class="stats-label">// PRELIMS · REASONING</span>
        <span class="stats-count">100 SETS</span>
      </div>
      <div class="cards-grid" id="grid-pre-rea"></div>
    </div>
  </div>

  <!-- ══════════ MAINS MODULE ══════════ -->
  <div class="module-panel mains-panel" id="panel-mains">
    <div class="section-tabs">
      <button class="sec-btn active" onclick="switchSection('mains','english')">English</button>
      <button class="sec-btn" onclick="switchSection('mains','reasoning')">Reasoning</button>
    </div>

    <!-- Mains → English -->
    <div class="section-content active" id="mains-english">
      <div class="stats-bar">
        <span class="stats-label">// MAINS · ENGLISH</span>
        <span class="stats-count">100 SETS</span>
      </div>
      <div class="cards-grid" id="grid-mai-eng"></div>
    </div>

    <!-- Mains → Reasoning -->
    <div class="section-content" id="mains-reasoning">
      <div class="stats-bar">
        <span class="stats-label">// MAINS · REASONING</span>
        <span class="stats-count">100 SETS</span>
      </div>
      <div class="cards-grid" id="grid-mai-rea"></div>
    </div>
  </div>

  <footer>
    <p>© 2025 THE SSC SCHOLARS · ALL RIGHTS RESERVED</p>
  </footer>

</div>

<script>
  // ─── Data config ───
  const config = {
    'pre-eng': {
      folder: 'Pre English',
      prefix: 'Prelims Mastery Quiz 2025 English',
      label: 'English',
      icon: '📝'
    },
    'pre-rea': {
      folder: 'Pre Reasoning',
      prefix: 'Prelims Mastery Quiz 2025 Reasoning',
      label: 'Reasoning',
      icon: '🧩'
    },
    'mai-eng': {
      folder: 'Mains English',
      prefix: 'Mains Mastery Quiz 2025 English',
      label: 'English',
      icon: '📝'
    },
    'mai-rea': {
      folder: 'Mains Reasoning',
      prefix: 'Mains Mastery Quiz 2025 Reasoning',
      label: 'Reasoning',
      icon: '🧩'
    }
  };

  // ─── Build cards ───
  function buildGrid(gridId, cfg) {
    const grid = document.getElementById('grid-' + gridId);
    let html = '';
    for (let d = 1; d <= 100; d++) {
      const filename = `${cfg.prefix} (Day-${d}).html`;
      const href = `bank%20dpq/${cfg.folder.replace(/ /g,'%20')}/${encodeURIComponent(filename)}`;
      html += `
        <a class="day-card" href="${href}" target="_blank">
          <span class="card-icon">${cfg.icon}</span>
          <div class="card-day">DAY ${String(d).padStart(2,'0')}</div>
          <div class="card-title">${cfg.label} Set</div>
        </a>`;
    }
    grid.innerHTML = html;
  }

  // ─── Module switch ───
  let currentModule = 'prelims';
  function switchModule(mod) {
    currentModule = mod;
    document.querySelectorAll('.module-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.mod-btn').forEach(b => b.classList.remove('active', 'active-mains'));
    document.getElementById('panel-' + mod).classList.add('active');
    const btns = document.querySelectorAll('.mod-btn');
    if (mod === 'prelims') btns[0].classList.add('active');
    else { btns[1].classList.add('active'); btns[1].classList.add('active-mains'); }
  }

  // ─── Section switch ───
  function switchSection(mod, sec) {
    const panel = document.getElementById('panel-' + mod);
    panel.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
    panel.querySelectorAll('.sec-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(mod + '-' + sec).classList.add('active');
    event.target.classList.add('active');
  }

  // ─── Init all grids ───
  buildGrid('pre-eng', config['pre-eng']);
  buildGrid('pre-rea', config['pre-rea']);
  buildGrid('mai-eng', config['mai-eng']);
  buildGrid('mai-rea', config['mai-rea']);
</script>
</body>
</html>
